# How long a full club match is.
#
# A club 8-ball, 9-ball or 10-ball is weighted by the winner's racks
# divided by the race length:
#     weight = winner's racks / race
# A 5:4 in 9-ball is 5/7. 8-ball and 10-ball race to 5, so a 3:2 is 3/5.
# A winner who runs past the race weighs more than 1.
# Official league games are not scaled here. Their race length depends on
# the league, and the scraped score is already a finished match.
#
# 14/1 is counted in balls, both players added together.
# 60:40 is 100/70. 36:20 is 56/70 of a match.

[full_set]
8-Ball = 5
9-Ball = 7
10-Ball = 5
14/1e = 70
