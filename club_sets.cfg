# How long a full club match is.
#
# A club game that stops early counts as only part of a match:
#     weight = min(1, amount played / full set)
# A game that reaches the full set keeps weight 1, however long it ran.
# Official league games are not scaled here. Their race length depends on
# the league, and the scraped score is already a finished match.
#
# 8-Ball, 9-Ball and 10-Ball are counted in racks.
# A 2:1 in 8-Ball is 3/5 of a match. A 7:4 in 9-Ball is a full match.
# 14/1 is counted in balls, both players added together.
# 60:40 is 100/70, which caps at one match. 36:20 is 56/70 of a match.

[full_set]
8-Ball = 5
9-Ball = 7
10-Ball = 5
14/1e = 70
